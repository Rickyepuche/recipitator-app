<html lang="en">  
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="keywords" content="Recipe ideas, cooking, food, recipes, meal planning, culinary tips, kitchen hacks, healthy eating, quick meals, gourmet recipes">

        <meta name="robots" content="index, follow">
        <title>Recipitator | Ultimate Recipe Hub - Delicious Recipes & Cooking Tips</title>

        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link rel="canonical" href="https://github.com/Rickyepuche/recipitator-app">
        
        <!-- Open Graph Meta Tags -->
        <meta property="og:title" content="Recipitator | Ultimate Recipe Hub">
        <meta property="og:description" content="Discover delicious recipes, cooking tips, and meal ideas. Your ultimate destination for culinary inspiration.">
        <meta property="og:image" content="https://github.com/Rickyepuche/recipitator-app/src/images/og-image.jpg">
        <meta property="og:url" content="">

        <meta property="og:site_name" content="Recipitator">
        
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Recipitator | Ultimate Recipe Hub">
        <meta name="twitter:description" content="Discover delicious recipes, cooking tips, and meal ideas. Your ultimate destination for culinary inspiration.">
        <meta name="twitter:image" content="https://github.com/Rickyepuche/recipitator-app/src/images/og-image.jpg">
        <meta name="twitter:creator" content="@rickyepuche">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tourney:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
        <link rel="stylesheet" href="../css/style.css"/>
        <script type="module" src="../js/main.js"></script>
    </head>
    <body>
        <header class="divider" id="main-header"></header>
        <main>
            
                
            <div id="searchWrapper" class="search-hidden">
                <div class="filters"><button id="showFilter"><img src="/src/images/filter-icon.png" alt="filter"></button></div>
                <input id="recipe-input" type="text"  placeholder="🔍">
                <button id="recipe-search">search</button>
            </div>
                

            <div class="recipe-filter hidden">
                <form id="recipe-filter-form">
                    <fieldset>
                        <legend>Diet</legend>
                        <label>
                            <input type="radio" name="diet" value="vagan">
                            <span>Vegan</span>
                        </label>

                        <label>
                            <input type="radio" name="diet" value="vegetarian">
                            <span>Vegetarian</span>
                        </label>

                        <label>
                            <input type="radio" name="diet" value="ketogenic">
                            <span>Ketogenic</span>
                        </label>

                        <label>
                            <input type="radio" name="diet" value="lacto-vegetarian">
                            <span>Lacto-vegetarian</span>
                        </label>

                        <label>
                            <input type="radio" name="diet" value="ovo-vegetarian">
                            <span>Ovo-vegetarian</span>
                        </label>

                        <label>
                            <input type="radio" name="diet" value="lacto-ovo vegetarian">
                            <span>Lacto-ovo vegetarian</span>
                        </label>
                    </fieldset>
                    <fieldset>
                        <legend>Allergies</legend>
                        <label>
                            <input type="checkbox" name="intolerances" value="dairy">
                            <span>Dairy</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="egg">
                            <span>Egg</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="gluten">
                            <span>Gluten</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="grain">
                            <span>Grain</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="peanut">
                            <span>Peanut</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="soy">
                            <span>Soy</span>
                        </label>

                        <label>
                            <input type="checkbox" name="intolerances" value="wheat">
                            <span>Wheat</span>
                        </label>
                    </fieldset>
                </form>
            </div>
            <div id="recipe-results" class="recipe-results"></div>
        </main>
        <footer id="main-footer"></footer>
    </body>
</html>
